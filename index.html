function renderPaper(){const notes=[gift.wish,...paperNotes];$('#blessing').textContent=notes[paperIndex];$('#paper-count').textContent=(paperIndex+1)+' / '+notes.length;$('#greeting').textContent=gift.name==='你'?'今日小纸条':gift.name+'的今日小纸条'}

for(let i=0;i<3;i++){const el=$('#star-'+i);el.addEventListener('pointerdown',e=>{if(play.flight||play.launchPending||play.collected[i]||play.drag||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();el.focus({preventScroll:true});const home=homePoint(i);play.drag={id:i,pointerId:e.pointerId,x:home.x,y:home.y,startX:e.clientX,startY:e.clientY,offsetX:home.x-e.clientX,offsetY:home.y-e.clientY,moved:false};el.setPointerCapture(e.pointerId);el.classList.add('dragging');$('#drop-hint').classList.add('active');$('#hint').textContent='把星星放进兔兔怀里的虚线圈';});el.addEventListener('pointermove',e=>{const d=play.drag;if(!d||d.id!==i||d.pointerId!==e.pointerId)return;e.preventDefault();d.x=e.clientX+d.offsetX;d.y=e.clientY+d.offsetY;if(Math.hypot(e.clientX-d.startX,e.clientY-d.startY)>6)d.moved=true;$('#drop-hint').classList.toggle('ready',inArms(d.x,d.y));layoutTargets()});el.addEventListener('pointerup',e=>{const d=play.drag;if(!d||d.id!==i||d.pointerId!==e.pointerId)return;e.preventDefault();d.x=e.clientX+d.offsetX;d.y=e.clientY+d.offsetY;const moved=d.moved||Math.hypot(e.clientX-d.startX,e.clientY-d.startY)>6,accepted=!moved||inArms(d.x,d.y),x=d.x,y=d.y;cancelDrag();if(accepted)collectStar(i,x,y);else $('#caption').textContent='再试一下，兔兔的两只小爪子在等星星';$('#hint').textContent=play.launchPending?'三颗星星，启动小飞船 ✦':'集齐 3 颗，兔兔有个小秘密';});for(const type of ['pointercancel','lostpointercapture'])el.addEventListener(type,e=>{if(play.drag&&play.drag.id===i&&play.drag.pointerId===e.pointerId){cancelDrag();$('#hint').textContent='拖星星或直接点击，都可以送到兔兔怀里'}});el.addEventListener('click',e=>{if(e.detail!==0)return;cancelDrag();const p=homePoint(i);collectStar(i,p.x,p.y)});}

function playNote(freq,delay=0){const at=audio.currentTime+delay,o=audio.createOscillator(),gain=audio.createGain();o.type='sine';o.frequency.value=freq;gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(.06,at+.02);gain.gain.exponentialRampToValueAtTime(.001,at+2);o.connect(gain);gain.connect(audio.destination);o.start(at);o.stop(at+2.1);o.onended=()=>{o.disconnect();gain.disconnect()}}function phrase(){const notes=[523.25,659.25,783.99,659.25,587.33,698.46,880,783.99];playNote(notes[noteIndex++%notes.length]);playNote(261.63,.12)}$('#music').addEventListener('click',async()=>{try{if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('unsupported');audio=new AC()}if(musicOn){clearInterval(musicTimer);musicTimer=null;await audio.suspend();musicOn=false}else{await audio.resume();musicOn=true;phrase();musicTimer=setInterval(phrase,1250)}$('#music').classList.toggle('music-on',musicOn);$('#music').setAttribute('aria-pressed',String(musicOn));$('#music').setAttribute('aria-label',musicOn?'关闭音乐':'开启音乐');$('#music').title=musicOn?'关闭音乐':'开启音乐'}catch{notify('当前浏览器暂时无法播放音乐')}});
